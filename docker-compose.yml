services:
  # Next.js 16 Production Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saas-starter-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/saas_db
    depends_on:
      postgres:
        condition: service_healthy

  # Local PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: saas-starter-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: saas_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saas_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local Redis 7 (Caching & Rate Limiting)
  redis:
    image: redis:7-alpine
    container_name: saas-starter-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
