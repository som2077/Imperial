name: 💡 Feature Request / Proposal
description: Suggest an idea or enhancement for the SaaS Starter Kit
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome feature ideas and architecture improvements! Please check existing issues first.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution & Architecture
      description: Describe what you would like to see added or changed.
      placeholder: Add support for...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've evaluated.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any mockups, links to docs, or related examples.
