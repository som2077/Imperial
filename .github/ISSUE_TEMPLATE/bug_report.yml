name: 🐛 Bug Report
description: Create a report to help us improve the SaaS Starter Kit
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible.
  - type: input
    id: environment
    attributes:
      label: Node & Next.js Environment
      description: What version of Node.js and OS are you using?
      placeholder: e.g. Node 20.12.0, macOS Sonoma / Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run 'npm run dev'
        2. Navigate to '...'
        3. Click on '....'
        4. See error in console
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal / Browser Logs
      description: Copy & paste relevant logs or error stack traces.
      render: shell
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
